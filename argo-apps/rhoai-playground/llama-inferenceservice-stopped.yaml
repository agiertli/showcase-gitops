apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,SkipHealthCheck=true
    openshift.io/display-name: llama-32-3b-instruct
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/stop: "true"
    security.opendatahub.io/enable-auth: "false"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  name: llama-32-3b-instruct
  namespace: my-first-model
spec:
  predictor:
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - --dtype=half
        - --max-model-len=20000
        - --gpu-memory-utilization=0.95
        - --enable-auto-tool-choice
        - --tool-call-parser=llama3_json
        - --chat-template=/opt/app-root/template/tool_chat_template_llama3.2_json.jinja
      modelFormat:
        name: vLLM
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "1"
          memory: 6Gi
          nvidia.com/gpu: "1"
      runtime: llama-32-3b-instruct
      storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-3b-instruct
