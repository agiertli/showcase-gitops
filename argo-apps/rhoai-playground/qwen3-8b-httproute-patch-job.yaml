# Workaround for RHOAI 3.4.2 bug: the llmisvc-controller-manager creates
# the HTTPRoute without backendRefs because the template ConfigMap
# v3-4-2-kserve-config-llm-router-route is missing from the cluster.
# This post-sync hook patches the HTTPRoute to add the correct backendRef.
# Remove this once the bug is fixed upstream or the ConfigMap is restored.
apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8b-httproute-patch
  namespace: rhoai-playground
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: qwen3-8b-httproute-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Waiting for HTTPRoute to exist..."
              for i in $(seq 1 30); do
                if oc get httproute qwen3-8b-kserve-route -n rhoai-playground 2>/dev/null; then
                  break
                fi
                echo "Attempt $i: HTTPRoute not found, waiting 10s..."
                sleep 10
              done

              BACKEND=$(oc get httproute qwen3-8b-kserve-route -n rhoai-playground \
                -o jsonpath='{.spec.rules[0].backendRefs}' 2>/dev/null || echo "")

              if [ -z "$BACKEND" ] || [ "$BACKEND" = "null" ]; then
                echo "HTTPRoute has no backendRefs, patching..."
                oc patch httproute qwen3-8b-kserve-route -n rhoai-playground \
                  --type='json' \
                  -p='[{"op":"add","path":"/spec/rules/0/backendRefs","value":[{"group":"","kind":"Service","name":"qwen3-8b-kserve-workload-svc","port":8000,"weight":1}]}]'
                echo "Patch applied successfully."
              else
                echo "HTTPRoute already has backendRefs, skipping patch."
              fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen3-8b-httproute-patcher
  namespace: rhoai-playground
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-8b-httproute-patcher
  namespace: rhoai-playground
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen3-8b-httproute-patcher
  namespace: rhoai-playground
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: qwen3-8b-httproute-patcher
    namespace: rhoai-playground
roleRef:
  kind: Role
  name: qwen3-8b-httproute-patcher
  apiGroup: rbac.authorization.k8s.io
