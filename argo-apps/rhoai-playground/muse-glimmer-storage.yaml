  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: models
  AWS_S3_ENDPOINT: http://minio-service.minio.svc.cluster.local:9000
  AWS_SECRET_ACCESS_KEY: minio123
