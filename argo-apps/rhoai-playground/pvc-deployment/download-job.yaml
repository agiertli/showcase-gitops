apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen3-8b
  namespace: rhoai-playground
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: model-downloader
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: downloader
          image: registry.redhat.io/ubi9/python-312:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - bash
            - -exc
            - |
              pip install -q huggingface_hub

              huggingface-cli login --token "$HF_TOKEN"

              huggingface-cli download \
                Qwen/Qwen3-8B \
                --local-dir /mnt/models/Qwen3-8B \
                --local-dir-use-symlinks False \
                --resume-download

              echo "Download complete. Contents:"
              ls -lh /mnt/models/Qwen3-8B/
              du -sh /mnt/models/Qwen3-8B/
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HUB_CACHE
              value: /tmp/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf-cache
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: qwen3-8b-model
        - name: tmp
          emptyDir:
            sizeLimit: 20Gi
