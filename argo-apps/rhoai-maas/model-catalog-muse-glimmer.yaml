apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app: model-catalog
    app.kubernetes.io/component: model-catalog
    app.kubernetes.io/name: model-catalog
    app.kubernetes.io/part-of: model-catalog
    component: model-catalog
  name: model-catalog-sources
  namespace: rhoai-model-registries
data:
  sources.yaml: |
    catalogs:
    - name: Custom Models
      id: custom_models
      type: yaml
      enabled: true
      properties:
        yamlCatalogPath: muse-glimmer-catalog.yaml
      labels:
      - Custom
  muse-glimmer-catalog.yaml: |
    source: Custom
    models:
    - name: RedHatAI/Muse-Glimmer-30B-FP8-block
      provider: Red Hat AI
      description: >-
        Muse Glimmer 30B is a multimodal AI model with vision, reasoning, and tool-calling
        capabilities. FP8 block-quantized for single-GPU deployment.
      readme: >-
        # Muse-Glimmer-30B-FP8-block


        Muse Glimmer 30B is a Red Hat AI model with advanced reasoning,
        tool-calling, and multimodal (vision) capabilities.
        This FP8 block-quantized variant is optimized for single-GPU deployment
        using a custom vLLM image with muse_glimmer reasoning and tool-call parsers.


        ## Key Features

        - **Multimodal Vision**: Process images alongside text

        - **Reasoning**: Chain-of-thought reasoning with dedicated reasoning field

        - **Tool Calling**: Native function calling support

        - **FP8 Quantization**: Block-quantized for efficient single-GPU inference


        ## Deployment

        Requires custom vLLM image with muse_glimmer parsers.
        Deploy via RHOAI Models-as-a-Service (MaaS) or KServe raw deployment.
      license: apache-2.0
      licenseLink: https://www.apache.org/licenses/LICENSE-2.0
      language: []
      logo: data:image/svg+xml;base64,
      tasks:
      - text-generation
      customProperties:
        model_type:
          metadataType: MetadataStringValue
          string_value: generative
      artifacts:
      - uri: s3://models/RedHatAI/Muse-Glimmer-30B-FP8-block
        customProperties:
          source:
            metadataType: MetadataStringValue
            string_value: https://huggingface.co/RedHatAI/Muse-Glimmer-30B-FP8-block
          type:
            metadataType: MetadataStringValue
            string_value: s3
