apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: demo-subscription
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: argocdadmins
    users:
      - admin
  modelRefs:
    - name: muse-glimmer
      namespace: muse-glimmer
      tokenRateLimits:
        - limit: 1000000
          window: "1h"
        - limit: 5000000
          window: "24h"
  priority: 10
  tokenMetadata:
    organizationId: ministry-of-defence
    costCenter: ai-innovation-centre
    labels:
      department: cyber-operations
      environment: production
