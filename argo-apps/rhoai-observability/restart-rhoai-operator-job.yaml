apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: rhoai-operator-restart-sa
  namespace: redhat-ods-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: rhoai-operator-restart-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: rhoai-operator-restart-binding
subjects:
  - kind: ServiceAccount
    name: rhoai-operator-restart-sa
    namespace: redhat-ods-operator
roleRef:
  kind: ClusterRole
  name: rhoai-operator-restart-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: restart-rhoai-operator-for-coo
  namespace: redhat-ods-operator
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: rhoai-operator-restart-sa
      restartPolicy: OnFailure
      containers:
        - name: restart
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for MonitoringStack CRD (COO)..."
              for i in $(seq 1 60); do
                if oc get crd monitoringstacks.monitoring.rhobs &>/dev/null; then
                  echo "MonitoringStack CRD found"
                  break
                fi
                echo "Attempt $i/60 - waiting..."
                sleep 10
              done

              if ! oc get crd monitoringstacks.monitoring.rhobs &>/dev/null; then
                echo "MonitoringStack CRD not available after 10 minutes, exiting"
                exit 1
              fi

              echo "Rolling restart RHOAI operator so it detects COO CRDs..."
              oc rollout restart deployment/rhods-operator -n redhat-ods-operator

              echo "Waiting for rollout to complete..."
              oc rollout status deployment/rhods-operator -n redhat-ods-operator --timeout=120s

              echo "Done — operator will now create Perses, MonitoringStack, etc."
