---
# PVCs for model storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-model-2
  namespace: csob-sandbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-model-3
  namespace: csob-sandbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gemma-model-4
  namespace: csob-sandbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 30Gi
---
# Download Jobs — pull model from HuggingFace in parallel
apiVersion: batch/v1
kind: Job
metadata:
  name: download-gemma-2
  namespace: csob-sandbox
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      containers:
        - name: download
          image: registry.redhat.io/ubi9/python-312:latest
          command:
            - /bin/bash
            - -c
            - |
              pip install -q huggingface_hub
              python3 -c "
              from huggingface_hub import snapshot_download
              snapshot_download(
                  'RedHatAI/gemma-4-12B-it-FP8-Dynamic',
                  local_dir='/models/gemma-4-12B-it-FP8-Dynamic',
                  local_dir_use_symlinks=False,
              )
              print('Download complete')
              "
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: gemma-model-2
