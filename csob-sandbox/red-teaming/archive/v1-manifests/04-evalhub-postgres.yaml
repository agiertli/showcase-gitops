apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db-credentials
  namespace: csob-sandbox
type: Opaque
stringData:
  db-url: "postgres://evalhub:evalhub123@evalhub-postgres.csob-sandbox.svc.cluster.local:5432/evalhub"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalhub-postgres
  namespace: csob-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evalhub-postgres
  template:
    metadata:
      labels:
        app: evalhub-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              value: evalhub
            - name: POSTGRESQL_PASSWORD
              value: evalhub123
            - name: POSTGRESQL_DATABASE
              value: evalhub
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: evalhub-postgres
  namespace: csob-sandbox
spec:
  selector:
    app: evalhub-postgres
  ports:
    - port: 5432
      targetPort: 5432
