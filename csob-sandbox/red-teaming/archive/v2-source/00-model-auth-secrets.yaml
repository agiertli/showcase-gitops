# Unified secret for intents scans — carries role-specific API keys.
# Target model (gemma) is auth-free, so api-key falls through to DUMMY.
# Judge/SDG/Attacker use RHDP MaaS (qwen36-35b-a3b), which requires an API key.
#
# Key fallback order per role: {ROLE}_API_KEY → API_KEY → api-key → "DUMMY"
# See RHOAI 3.5 docs, Section 7.7.4 (EvalHub job parameters).
#
# The RHDP API key value is already in the existing "rhdp-model-auth" secret
# on the cluster. Copy it here, or replace the placeholder below.
---
apiVersion: v1
kind: Secret
metadata:
  name: intents-model-auth
  namespace: csob-sandbox
type: Opaque
stringData:
  api-key: "DUMMY"
  JUDGE_API_KEY: "sk-Bp14I4zzIReOgBx8-uHuAQ"
  SDG_API_KEY: "sk-Bp14I4zzIReOgBx8-uHuAQ"
  ATTACKER_API_KEY: "sk-Bp14I4zzIReOgBx8-uHuAQ"
---
# S4 credentials for DSPA pipeline storage (used by garak-kfp intents)
apiVersion: v1
kind: Secret
metadata:
  name: s4-credentials
  namespace: csob-sandbox
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: s4admin
  AWS_SECRET_ACCESS_KEY: s4secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_ENDPOINT: http://s4-service.csob-sandbox.svc.cluster.local:7480
  AWS_S3_BUCKET: garak-pipeline
