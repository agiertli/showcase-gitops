apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalhub-mlflow-experiment-create
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-mlflow-experiment-create-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-mlflow-experiment-create
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:{{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-scan-user
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-user
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
