apiVersion: v1
kind: Secret
metadata:
  name: intents-model-auth
  namespace: {{ include "evalhub-infra.namespace" . }}
type: Opaque
stringData:
  api-key: {{ .Values.modelAuth.targetApiKey | quote }}
  {{- if .Values.modelAuth.judgeApiKey }}
  JUDGE_API_KEY: {{ .Values.modelAuth.judgeApiKey | quote }}
  {{- end }}
  {{- if .Values.modelAuth.sdgApiKey }}
  SDG_API_KEY: {{ .Values.modelAuth.sdgApiKey | quote }}
  {{- end }}
  {{- if .Values.modelAuth.attackerApiKey }}
  ATTACKER_API_KEY: {{ .Values.modelAuth.attackerApiKey | quote }}
  {{- end }}
