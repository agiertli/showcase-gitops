apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-evalhub-to-dspa
  namespace: {{ include "evalhub-infra.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: ds-pipeline-dspa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: eval-hub
        - podSelector:
            matchLabels:
              component: evaluation-job
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8887
