apiVersion: apps/v1
kind: Deployment
metadata:
  name: granite-guardian
  namespace: csob-sandbox
  labels:
    app: granite-guardian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: granite-guardian
  template:
    metadata:
      labels:
        app: granite-guardian
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model=ibm-granite/granite-guardian-3.1-8b
            - --port=8080
            - --served-model-name=granite-guardian
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90
            - --dtype=bfloat16
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: HF_HOME
              value: /tmp/hf_home
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: granite-guardian
  namespace: csob-sandbox
spec:
  selector:
    app: granite-guardian
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: granite-guardian
  namespace: csob-sandbox
spec:
  to:
    kind: Service
    name: granite-guardian
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
